version: '3.8'

services:
  codshop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codshop-app
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@codshop-postgres:5432/codshop}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://codshop.vipone.site}
      - NEXT_PUBLIC_WILDCARD_DOMAIN=${NEXT_PUBLIC_WILDCARD_DOMAIN:-codshop.vipone.site}
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Platform router for codshop.vipone.site and merchant stores (*.codshop.vipone.site)
      - "traefik.http.routers.codshop-app.rule=Host(`codshop.vipone.site`) || HostRegexp(`{subdomain:[a-z0-9-]+}.codshop.vipone.site`)"
      - "traefik.http.routers.codshop-app.priority=10"
      - "traefik.http.routers.codshop-app.entrypoints=websecure"
      - "traefik.http.routers.codshop-app.tls=true"
      - "traefik.http.routers.codshop-app.tls.certresolver=letsencrypt"
      - "traefik.http.services.codshop-app.loadbalancer.server.port=3000"

networks:
  coolify:
    external: true
