version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codshop_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-codshop_db}
    volumes:
      - codshop_pgdata:/var/lib/postgresql/data
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codshop_user -d codshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  codshop:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codshop-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://codshop_user:codshop_secret_password@codshop-postgres:5432/codshop_db}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://codshop.vipone.site}
      - NEXT_PUBLIC_WILDCARD_DOMAIN=${NEXT_PUBLIC_WILDCARD_DOMAIN:-codshop.vipone.site}
    networks:
      - coolify
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # HTTP Router
      - "traefik.http.routers.codshop-app-http.entrypoints=http"
      - "traefik.http.routers.codshop-app-http.rule=Host(`codshop.vipone.site`) || HostRegexp(`[a-z0-9-]+\\.codshop\\.vipone\\.site`)"
      - "traefik.http.routers.codshop-app-http.priority=10"
      # HTTPS Router
      - "traefik.http.routers.codshop-app-https.entrypoints=https"
      - "traefik.http.routers.codshop-app-https.rule=Host(`codshop.vipone.site`) || HostRegexp(`[a-z0-9-]+\\.codshop\\.vipone\\.site`)"
      - "traefik.http.routers.codshop-app-https.priority=10"
      - "traefik.http.routers.codshop-app-https.tls=true"
      - "traefik.http.services.codshop-app.loadbalancer.server.port=3000"

volumes:
  codshop_pgdata:

networks:
  coolify:
    external: true
