version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: codshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codshop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codshop_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-codshop_db}
    ports:
      - "5433:5432" # Use 5433 on host to avoid conflict with existing postgres instances
    volumes:
      - codshop_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codshop_user -d codshop_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codshop-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3006:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://codshop_user:codshop_secret_password@db:5432/codshop_db
      - NEXT_PUBLIC_APP_URL=http://localhost:3006
      - NEXT_PUBLIC_WILDCARD_DOMAIN=codshop.site

volumes:
  codshop_pgdata:
